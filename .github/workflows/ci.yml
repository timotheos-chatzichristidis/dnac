name: build & losslessness

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  roundtrip:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest,  cc: clang }
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: make CC=${{ matrix.cc }} CFLAGS="-O2 -Wall -Wextra"

      # The only claim that must never regress: every byte comes back.
      # 149 SHA-256 round-trips across plain, reference, level and state modes.
      - name: Losslessness round-trips
        run: sh scripts/roundtrip.sh ./dnac

      - name: Sanity — compress/decompress a generated genome
        run: |
          ./dnac gen sample.fa 500000 42
          ./dnac c sample.fa sample.dnac 22
          ./dnac d sample.dnac back.fa
          cmp sample.fa back.fa
          ls -l sample.fa sample.dnac

      # The table geometry travels in the header, so a file must survive being
      # read by a build configured with different caps. This needs two binaries,
      # which the round-trip suite (given one exe) cannot arrange -- so it lives
      # here. Before v0.3.0 this silently produced wrong bytes and exit 0.
      - name: Portability — differently-sized tables must still decode
        run: |
          ${{ matrix.cc }} -O2 -Wall -Wextra -DHASHBITS_MAX=22 -DMHBITS_MAX=22 -o dnac_small dnac.c -lm
          ./dnac      c sample.fa big.dnac   22
          ./dnac_small c sample.fa small.dnac 22
          ./dnac_small d big.dnac   from_big.fa
          ./dnac       d small.dnac from_small.fa
          cmp sample.fa from_big.fa
          cmp sample.fa from_small.fa

  cross-compiler:
    name: gcc-compressed files must decode with clang (and back)
    runs-on: ubuntu-latest
    # The codec is deterministic because the encoder and decoder run identical
    # FLOAT code in the same order -- inside one binary. Nothing has ever checked
    # that two binaries from DIFFERENT COMPILERS agree, and if they do not, an
    # archive is silently tied to the toolchain that wrote it. That is the exact
    # shape of the v0.3.0 table-geometry bug (a parameter that selects behaviour
    # and does not travel with the file), and GeCo3 ships with a warning that its
    # own files may not decode across compilers. Measured 2026-08-19: gcc -O2 and
    # gcc -O3 produce byte-identical archives; clang was never tested, because
    # there is no clang on the measurement machine. This job is that test.
    steps:
      - uses: actions/checkout@v5

      - name: Build both
        run: |
          gcc   -O2 -Wall -Wextra -o dnac_gcc   dnac.c -lm
          clang -O2 -Wall -Wextra -o dnac_clang dnac.c -lm

      - name: Same input must compress to identical bytes
        run: |
          ./dnac_gcc gen s.fa 400000 7
          ./dnac_gcc   c s.fa g.dnac 22 3
          ./dnac_clang c s.fa c.dnac 22 3
          cmp g.dnac c.dnac || echo "NOTE: archives differ between compilers (see cross-decode below for whether that is fatal)"

      - name: Cross-decode both directions, every level
        run: |
          for lvl in 1 2 3; do
            ./dnac_gcc   c s.fa g$lvl.dnac 22 $lvl
            ./dnac_clang c s.fa c$lvl.dnac 22 $lvl
            ./dnac_clang d g$lvl.dnac from_gcc$lvl.fa
            ./dnac_gcc   d c$lvl.dnac from_clang$lvl.fa
            cmp s.fa from_gcc$lvl.fa
            cmp s.fa from_clang$lvl.fa
          done

      - name: Cross-decode in reference mode (priming runs the whole model too)
        run: |
          ./dnac_gcc gen ref.fa 400000 11
          ./dnac_gcc mut ref.fa tgt.fa 3 5
          ./dnac_gcc   cr tgt.fa g.ref.dnac ref.fa 22 3
          ./dnac_clang cr tgt.fa c.ref.dnac ref.fa 22 3
          ./dnac_clang dr g.ref.dnac from_gcc.fa   ref.fa
          ./dnac_gcc   dr c.ref.dnac from_clang.fa ref.fa
          cmp tgt.fa from_gcc.fa
          cmp tgt.fa from_clang.fa
