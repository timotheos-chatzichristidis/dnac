name: build & losslessness

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  roundtrip:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest,  cc: clang }
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # the v0.8.0 tag: v0.9.0 must read what it wrote

      - name: Build
        run: make CC=${{ matrix.cc }} CFLAGS="-O2 -Wall -Wextra"

      # The only claim that must never regress: every byte comes back.
      # SHA-256 round-trips across plain, reference, level, state and block
      # modes, the cue's own cases, and the stored v0.8.0 streams in tests/v080.
      - name: Losslessness round-trips
        run: sh scripts/roundtrip.sh ./dnac

      # Since v0.9.0 the cue is on in every build and switched at run time; the
      # switch travels in the magic. Switched off (-DCUE_DEFAULT=0, with
      # v0.8.0's level default) the build must BE v0.8.0 -- the same bytes as
      # the tag -- and an experimental build (a cue parameter moved) must mark
      # its files so no release build reads them. The suite asserts each
      # family's own rules, so it runs on all three.
      - name: Build the cue switched off, and an experimental build
        run: |
          ${{ matrix.cc }} -O2 -Wall -Wextra -DCUE_DEFAULT=0 -DREF_LEVEL_DEFAULT=3 -o dnac_v08 dnac.c -lm -pthread
          ${{ matrix.cc }} -O2 -Wall -Wextra -DCUE_MINLEN=16 -o dnac_exp dnac.c -lm -pthread

      - name: Losslessness round-trips, cue off and experimental
        run: |
          sh scripts/roundtrip.sh ./dnac_v08
          sh scripts/roundtrip.sh ./dnac_exp

      # The things that must not happen: the cue switched off is not v0.8.0; the
      # release build writes v0.8.0's bytes (the cue never switched on); v0.9.0
      # cannot read a v0.8.0 archive; v0.8.0 reads a v0.9.0 archive as if it
      # were its own -- which is what a cue archive with v0.8.0's magic did
      # before (docs/batch4.md, P0: exit 0, wrong bytes).
      - name: The cue switched off is v0.8.0, and the two families never mix
        run: |
          git show v0.8.0:dnac.c > v080.c
          ${{ matrix.cc }} -O2 -o dnac_v080 v080.c -lm -pthread
          ./dnac gen cue_ref.fa 300000 5
          ./dnac mut cue_ref.fa cue_tgt.fa 8 9
          for lvl in 1 3; do
            ./dnac_v080 cr cue_tgt.fa old$lvl.dnac cue_ref.fa 22 $lvl
            ./dnac_v08  cr cue_tgt.fa v08_$lvl.dnac cue_ref.fa 22 $lvl
            cmp old$lvl.dnac v08_$lvl.dnac
            ./dnac      cr cue_tgt.fa new$lvl.dnac cue_ref.fa 22 $lvl
            if cmp -s old$lvl.dnac new$lvl.dnac; then
              echo "the release build wrote v0.8.0's bytes: the cue is not on"; exit 1
            fi
            ./dnac dr old$lvl.dnac back$lvl.fa cue_ref.fa
            cmp cue_tgt.fa back$lvl.fa
            if ./dnac_v080 dr new$lvl.dnac bad$lvl.fa cue_ref.fa 2>/dev/null; then
              echo "v0.8.0 accepted a v0.9.0 stream"; exit 1
            fi
          done

      - name: Sanity — compress/decompress a generated genome
        run: |
          ./dnac gen sample.fa 500000 42
          ./dnac c sample.fa sample.dnac 22
          ./dnac d sample.dnac back.fa
          cmp sample.fa back.fa
          ls -l sample.fa sample.dnac

      # The table geometry travels in the header, so a file must survive being
      # read by a build configured with different caps. This needs two binaries,
      # which the round-trip suite (given one exe) cannot arrange -- so it lives
      # here. Before v0.3.0 this silently produced wrong bytes and exit 0.
      - name: Portability — differently-sized tables must still decode
        run: |
          ${{ matrix.cc }} -O2 -Wall -Wextra -DHASHBITS_MAX=22 -DMHBITS_MAX=22 -o dnac_small dnac.c -lm
          ./dnac      c sample.fa big.dnac   22
          ./dnac_small c sample.fa small.dnac 22
          ./dnac_small d big.dnac   from_big.fa
          ./dnac       d small.dnac from_small.fa
          cmp sample.fa from_big.fa
          cmp sample.fa from_small.fa

  cross-compiler:
    name: gcc-compressed files must decode with clang (and back)
    runs-on: ubuntu-latest
    # The codec is deterministic because the encoder and decoder run identical
    # FLOAT code in the same order -- inside one binary. Nothing has ever checked
    # that two binaries from DIFFERENT COMPILERS agree, and if they do not, an
    # archive is silently tied to the toolchain that wrote it. That is the exact
    # shape of the v0.3.0 table-geometry bug (a parameter that selects behaviour
    # and does not travel with the file), and GeCo3 ships with a warning that its
    # own files may not decode across compilers. Measured 2026-08-19: gcc -O2 and
    # gcc -O3 produce byte-identical archives; clang was never tested, because
    # there is no clang on the measurement machine. This job is that test.
    steps:
      - uses: actions/checkout@v5

      - name: Build both
        run: |
          gcc   -O2 -Wall -Wextra -o dnac_gcc   dnac.c -lm -pthread
          clang -O2 -Wall -Wextra -o dnac_clang dnac.c -lm -pthread

      - name: Same input must compress to identical bytes
        run: |
          ./dnac_gcc gen s.fa 400000 7
          ./dnac_gcc   c s.fa g.dnac 22 3
          ./dnac_clang c s.fa c.dnac 22 3
          # Hard assertion since 2026-08-20. It was written as `cmp || echo NOTE`
          # while nobody knew whether gcc and clang agree -- but a step that
          # cannot fail proves nothing, and the first green run showed it does
          # hold: the cross-decodes below pass in BOTH directions at every level
          # and in reference mode, which is only possible if the two builds
          # evolve bit-identical models, which in turn forces identical output.
          cmp g.dnac c.dnac

      - name: Cross-decode both directions, every level
        run: |
          for lvl in 1 2 3 4; do
            ./dnac_gcc   c s.fa g$lvl.dnac 22 $lvl
            ./dnac_clang c s.fa c$lvl.dnac 22 $lvl
            ./dnac_clang d g$lvl.dnac from_gcc$lvl.fa
            ./dnac_gcc   d c$lvl.dnac from_clang$lvl.fa
            cmp s.fa from_gcc$lvl.fa
            cmp s.fa from_clang$lvl.fa
          done

      - name: Cross-decode in reference mode (priming runs the whole model too)
        run: |
          ./dnac_gcc gen ref.fa 400000 11
          ./dnac_gcc mut ref.fa tgt.fa 3 5
          ./dnac_gcc   cr tgt.fa g.ref.dnac ref.fa 22 3
          ./dnac_clang cr tgt.fa c.ref.dnac ref.fa 22 3
          ./dnac_clang dr g.ref.dnac from_gcc.fa   ref.fa
          ./dnac_gcc   dr c.ref.dnac from_clang.fa ref.fa
          cmp tgt.fa from_gcc.fa
          cmp tgt.fa from_clang.fa

      # The cue adds a probability table and a mixer input to the float path
      # that this job exists to police, and v0.9.0 ships it on by default, so
      # the two builds above already carry it. There is no clang on the
      # measurement machine, so this is the only place the cross-COMPILER half
      # of docs/reference-free.md's P7 can run; the float-variant half runs
      # locally (scripts/cue/fpident.sh). Reference mode is where the cue
      # actually speaks, so it would show a float disagreement first -- at both
      # levels, and at the default level, which is 1 there.
      - name: The cue must be identical across compilers too
        run: |
          ./dnac_gcc gen cue_s.fa 400000 13
          ./dnac_gcc mut cue_s.fa cue_t.fa 8 21
          for lvl in 1 3; do
            ./dnac_gcc   cr cue_t.fa rg$lvl.dnac cue_s.fa 22 $lvl
            ./dnac_clang cr cue_t.fa rc$lvl.dnac cue_s.fa 22 $lvl
            cmp rg$lvl.dnac rc$lvl.dnac
            ./dnac_clang dr rg$lvl.dnac from_rg$lvl.fa cue_s.fa
            ./dnac_gcc   dr rc$lvl.dnac from_rc$lvl.fa cue_s.fa
            cmp cue_t.fa from_rg$lvl.fa
            cmp cue_t.fa from_rc$lvl.fa
          done
          ./dnac_gcc   cr cue_t.fa rgd.dnac cue_s.fa
          ./dnac_clang cr cue_t.fa rcd.dnac cue_s.fa
          cmp rgd.dnac rcd.dnac
          cmp rgd.dnac rg1.dnac     # the default in reference mode is level 1

      - name: Threads must not change a single byte
        run: |
          # -j N is a FORMAT decision (how many blocks); threading is only who
          # does the work. A build with no threads at all must produce the same
          # archive, or the thread-local/shared split of the model state is wrong
          # somewhere -- which is exactly the bug that would otherwise be silent.
          gcc -O2 -Wall -Wextra -DDNAC_NO_THREADS -o dnac_nothr dnac.c -lm
          ./dnac_gcc   gen jb.fa 300000 3
          for j in 1 2 5 8; do
            ./dnac_gcc  c jb.fa par$j.dnac 22 3 -j $j
            ./dnac_nothr c jb.fa seq$j.dnac 22 3 -j $j
            cmp par$j.dnac seq$j.dnac
            ./dnac_nothr d par$j.dnac from_par$j.fa
            ./dnac_gcc   d seq$j.dnac from_seq$j.fa
            cmp jb.fa from_par$j.fa
            cmp jb.fa from_seq$j.fa
          done
